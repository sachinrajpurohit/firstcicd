name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy to AWS EC2
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        request_pty: true # Isse saare terminal paths sahi se load ho jate hain
        script: |
          cd /home/ubuntu/dockerproject
          
          # Clean Git Fetch and Reset
          git fetch origin main
          git reset --hard origin/main
          
          # Plain Docker commands (ab permissions thik hain, bina path ke chalega)
          docker build -t firstjava:latest .
          docker rm -f firstjavacontainer || true
          docker run -d -p 5000:5000 --name firstjavacontainer firstjava:latest

