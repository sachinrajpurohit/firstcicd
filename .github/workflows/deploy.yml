name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy to AWS EC2
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          cd /home/ubuntu/dockerproject
          
          # Git pull ko sahi aur clean tarike se chalayein
          git fetch origin main
          git reset --hard origin/main
          
          # Bina sudo ke direct execution path ya plain docker commands
          /usr/bin/docker build -t firstjava:latest .
          /usr/bin/docker rm -f firstjavacontainer || true
          /usr/bin/docker run -d -p 5000:5000 --name firstjavacontainer firstjava:latest

