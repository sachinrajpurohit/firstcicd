name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy to AWS EC2
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          cd /home/ubuntu/dockerproject
          
          # Git pull ko force reset ke sath chalayein taaki naya code hamesha aaye
          sudo git fetch --all
          sudo git reset --hard origin/main
          
          # Docker commands with full path or sudo
          sudo docker build -t firstjava:latest .
          sudo docker rm -f firstjavacontainer || true
          sudo docker run -d -p 5000:5000 --name firstjavacontainer firstjava:latest
 

